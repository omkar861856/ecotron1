version: '3.8'

services:
  traefik:
    image: traefik:v3.6.15
    container_name: traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=omkardlolge@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letscert/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letscert/acme.json
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.ecotron.co.in`)"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls=true"
      - "traefik.http.routers.traefik-dash.tls.certresolver=myresolver"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    volumes:
      - ./data/db:/data/db
    networks:
      - web
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - ./data/redis:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=ecotron_secure_minio
    volumes:
      - ./data/minio:/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`storage.ecotron.co.in`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.tls.certresolver=myresolver"
      - "traefik.http.services.minio-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`console.ecotron.co.in`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.tls.certresolver=myresolver"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"

  ecotron-landing:
    build: 
      context: .
      dockerfile: ./apps/landing/Dockerfile
    image: ghcr.io/omkar861856/ecotron1-landing:latest
    container_name: ecotron-landing
    restart: always
    environment:
      - HOSTNAME=0.0.0.0
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.landing.rule=Host(`ecotron.co.in`) || Host(`www.ecotron.co.in`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls=true"
      - "traefik.http.routers.landing.tls.certresolver=myresolver"
      - "traefik.http.services.landing-svc.loadbalancer.server.port=3000"
    networks:
      - web

  ecotron-ad-server:
    build:
      context: .
      dockerfile: ./apps/ad-server/Dockerfile
    image: ghcr.io/omkar861856/ecotron1-ad-server:latest
    container_name: ecotron-ad-server
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ecotron
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=ecotron_secure_minio
      - CDN_URL=https://cdn.ecotron.co.in
      - HOSTNAME=0.0.0.0
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.adserver.rule=Host(`ads.ecotron.co.in`)"
      - "traefik.http.routers.adserver.entrypoints=websecure"
      - "traefik.http.routers.adserver.tls=true"
      - "traefik.http.routers.adserver.tls.certresolver=myresolver"
      - "traefik.http.services.adserver-svc.loadbalancer.server.port=8080"
    networks:
      - web

  ecotron-dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    image: ghcr.io/omkar861856/ecotron1-dashboard:latest
    container_name: ecotron-dashboard
    restart: always
    environment:
      - NEXT_PUBLIC_AD_SERVER_URL=https://ads.ecotron.co.in
      - NEXT_PUBLIC_CDN_URL=https://cdn.ecotron.co.in
      - HOSTNAME=0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.ecotron.co.in`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=myresolver"
      - "traefik.http.services.dashboard-svc.loadbalancer.server.port=3000"
    networks:
      - web

  ecotron-cdn:
    image: nginx:alpine
    container_name: ecotron-cdn
    restart: always
    volumes:
      - ./data/cdn:/usr/share/nginx/html
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cdn.rule=Host(`cdn.ecotron.co.in`)"
      - "traefik.http.routers.cdn.entrypoints=websecure"
      - "traefik.http.routers.cdn.tls=true"
      - "traefik.http.routers.cdn.tls.certresolver=myresolver"
      - "traefik.http.services.cdn-svc.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    external: true
