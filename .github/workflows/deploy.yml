name: Deploy Ecotron Ad Network

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Landing Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/landing/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ecotron1-landing:latest

      - name: Build & Push Ad Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ad-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ecotron1-ad-server:latest

      - name: Build & Push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ecotron1-dashboard:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/ecotron/v2
            cd ~/ecotron/v2
            
            if [ ! -d ".git" ]; then
              git clone https://github.com/omkar861856/ecotron1.git .
            else
              git fetch --all
              git reset --hard origin/main
            fi
            
            mkdir -p traefik data/cdn/js data/db data/redis data/minio
            touch traefik/acme.json
            chmod 600 traefik/acme.json
            
            docker network create web || true
            
            # Clean up conflicting legacy containers
            docker stop traefik ecotron-landing ecotron-ad-server ecotron-dashboard ecotron-cdn ecotron-web || true
            docker rm traefik ecotron-landing ecotron-ad-server ecotron-dashboard ecotron-cdn ecotron-web || true
            
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
