name: Deploy Ecotron Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /root/ecotron
          if [ ! -d ".git" ]; then
            rm -rf ./*
            git clone https://github.com/omkar861856/ecotron1.git .
          else
            git fetch --all
            git reset --hard origin/main
          fi
          
          # Ensure network exists
          docker network create ecotron-network || true
          
          # Clean up old images to save space
          docker image prune -f
          
          # Deploy with modern compose if available, otherwise fallback
          if docker compose version > /dev/null 2>&1; then
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          else
            docker-compose -f docker-compose.prod.yml up -d --build --remove-orphans
          fi
          
          echo "Waiting for Ollama to be ready..."
          sleep 15
          
          # Pull necessary models
          docker exec ollama ollama pull llama3.1:8b
          docker exec ollama ollama pull nomic-embed-text
          docker exec ollama ollama pull qwen2.5:7b
          
          echo "Deployment successful!"
