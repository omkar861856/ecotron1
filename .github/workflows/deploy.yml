name: Deploy Luck Game

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /home/${{ secrets.SERVER_USER }}/ecotron/letsencrypt
          touch /home/${{ secrets.SERVER_USER }}/ecotron/letsencrypt/acme.json
          chmod 600 /home/${{ secrets.SERVER_USER }}/ecotron/letsencrypt/acme.json
          cd /home/${{ secrets.SERVER_USER }}/ecotron
          if [ ! -d ".git" ]; then
            rm -rf ./*
            git clone https://github.com/omkar861856/ecotron1.git .
          else
            git fetch --all
            git reset --hard origin/main
          fi
          docker network create ecotron-network || true
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          echo "Waiting for Ollama to be ready..."
          sleep 10
          docker exec ollama ollama pull llama3.1:8b
          docker exec ollama ollama pull qwen2.5:7b
