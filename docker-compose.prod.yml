services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.24
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=omkar861856@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - ecotron-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ecotron-network

  redis:
    image: redis:7-alpine
    container_name: ecotron-redis
    restart: always
    networks:
      - ecotron-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecotron-api
    restart: always
    environment:
      - NODE_ENV=production
      - OLLAMA_URL=http://ollama:11434/api/generate
      - REDIS_URL=redis://ecotron-redis:6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.ecotron.co.in`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      - "traefik.docker.network=ecotron-network"
    depends_on:
      - ollama
      - redis
    networks:
      - ecotron-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ecotron-web
    restart: always
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`ecotron.co.in`) || Host(`www.ecotron.co.in`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=myresolver"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.docker.network=ecotron-network"
    networks:
      - ecotron-network

networks:
  ecotron-network:
    name: ecotron-network

volumes:
  ollama_data:
  letsencrypt:
