services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ecotron-network

  db:
    image: postgres:15-alpine
    container_name: ecotron-db
    restart: always
    environment:
      - POSTGRES_USER=ecotron
      - POSTGRES_PASSWORD=ecotron_pass
      - POSTGRES_DB=ecotron_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecotron-network

  minio:
    image: minio/minio:latest
    container_name: ecotron-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - ecotron-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ecotron-network

  redis:
    image: redis:7-alpine
    container_name: ecotron-redis
    restart: always
    networks:
      - ecotron-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecotron-api
    restart: always
    environment:
      - NODE_ENV=production
      - OLLAMA_URL=http://ollama:11434/api/generate
      - REDIS_URL=redis://ecotron-redis:6379
      - DATABASE_URL=postgresql://ecotron:ecotron_pass@db:5432/ecotron_db
      - GEMINI_API_KEY=AIzaSyBqJ4hq0Xy3YlQB7ckjAhS6y4NWE6e478s
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - db
      - minio
      - ollama
      - redis
    networks:
      - ecotron-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ecotron-web
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - ecotron-network

networks:
  ecotron-network:
    external: true

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
