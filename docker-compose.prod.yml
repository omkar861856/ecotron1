services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ecotron-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ecotron-network

  redis:
    image: redis:7-alpine
    container_name: ecotron-redis
    restart: always
    networks:
      - ecotron-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecotron-api
    restart: always
    environment:
      - NODE_ENV=production
      - OLLAMA_URL=http://ollama:11434/api/generate
      - REDIS_URL=redis://ecotron-redis:6379
    depends_on:
      - ollama
      - redis
    networks:
      - ecotron-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ecotron-web
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - ecotron-network

networks:
  ecotron-network:
    external: true

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
